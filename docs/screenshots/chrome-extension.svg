<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Left: Simulated Browser Tab (Gmail Ingestion) -->
  <g transform="translate(60, 45)">
    <!-- Browser window frame -->
    <rect width="650" height="585" rx="14" fill="#ffffff" filter="url(#shadow)"/>
    <rect width="650" height="42" rx="14" fill="#f1f5f9"/>
    <rect x="0" y="30" width="650" height="12" fill="#f1f5f9"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="75" y="10" width="460" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="25" font-family="sans-serif" font-size="10" fill="#64748b">🔒 mail.google.com/mail/u/0/#inbox/FMfcgzQvX...</text>

    <!-- Extension Icon pinned in browser -->
    <circle cx="560" cy="21" r="10" fill="#ca981d"/>
    <text x="560" y="25" font-family="serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>

    <!-- Gmail Interface Inside -->
    <g transform="translate(25, 60)">
      <text x="0" y="25" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Fully Executed Venue Agreement &amp; Deposit Receipt</text>
      
      <!-- Sender pill -->
      <g transform="translate(0, 40)">
        <circle cx="18" cy="18" r="18" fill="#ca981d" fill-opacity="0.15"/>
        <text x="18" y="23" font-family="serif" font-size="13" font-weight="bold" fill="#ca981d" text-anchor="middle">O</text>
        <text x="46" y="17" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Oakridge Events &lt;events@oakridgevenue.com&gt;</text>
        <text x="46" y="32" font-family="sans-serif" font-size="10" fill="#64748b">to Brianna Garland &lt;Brianna23Garland@gmail.com&gt;</text>
      </g>

      <!-- Body -->
      <g transform="translate(0, 95)">
        <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#334155">Hi Brianna,</text>
        <text x="0" y="42" font-family="sans-serif" font-size="12" fill="#334155">Thank you so much! We have counter-signed the wedding reservation agreement.</text>
        <text x="0" y="64" font-family="sans-serif" font-size="12" fill="#334155">Please find the finalized contract PDF attached below. Total investment: $14,500.</text>
        <text x="0" y="86" font-family="sans-serif" font-size="12" fill="#334155">Your $5,000 initial retainer has been credited. The walkthrough is set for May 14th.</text>
      </g>

      <!-- Attachment chip -->
      <g transform="translate(0, 220)">
        <rect width="320" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="12" y="12" width="36" height="36" rx="6" fill="#dc2626"/>
        <text x="30" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PDF</text>
        <text x="58" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Oakridge_Agreement_Signed.pdf</text>
        <text x="58" y="44" font-family="sans-serif" font-size="10" fill="#64748b">1.4 MB • Complete Executed Copy</text>
      </g>

      <!-- Overlay Pulse Detection Box -->
      <rect x="-10" y="15" width="620" height="280" rx="10" fill="none" stroke="#ca981d" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="440" y="25" width="160" height="24" rx="12" fill="#ca981d"/>
      <text x="520" y="41" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Ivory AI Detected Thread</text>
    </g>
  </g>

  <!-- Right: Simulated Ivory Chrome Extension Popup -->
  <g transform="translate(750, 45)">
    <rect width="390" height="585" rx="16" fill="#ffffff" stroke="#ebdcc0" filter="url(#shadow)"/>
    
    <!-- Extension Header -->
    <rect width="390" height="60" rx="16" fill="#2c2419"/>
    <circle cx="35" cy="30" r="14" fill="#ca981d"/>
    <text x="35" y="35" font-family="serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
    <text x="60" y="32" font-family="serif" font-size="17" font-weight="bold" fill="#ffffff">IVORY COPILOT</text>
    <text x="60" y="46" font-family="sans-serif" font-size="9" fill="#dfd2b9" letter-spacing="1">CHROME EXTENSION</text>
    <rect x="290" y="18" width="80" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
    <text x="330" y="33" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">Gmail Active</text>

    <!-- Body content of popup -->
    <g transform="translate(20, 80)">
      <text x="0" y="15" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Extracted Vendor Contract</text>
      
      <!-- Vendor Card -->
      <rect x="0" y="25" width="350" height="75" rx="10" fill="#faf6eb" stroke="#ebdcc0"/>
      <text x="15" y="50" font-family="serif" font-size="15" font-weight="bold" fill="#2c2419">Oakridge Venue &amp; Estate</text>
      <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#6e5d48">Category: Primary Venue • Sonoma Valley, CA</text>

      <!-- Extracted Fields Table -->
      <g transform="translate(0, 115)">
        <rect width="350" height="230" rx="10" fill="#ffffff" stroke="#ebdcc0"/>
        
        <!-- Field 1 -->
        <text x="15" y="30" font-family="sans-serif" font-size="11" fill="#8c7a63">Total Contract Fee:</text>
        <text x="335" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419" text-anchor="end">$14,500.00</text>
        <line x1="15" y1="45" x2="335" y2="45" stroke="#f0ebe0"/>

        <!-- Field 2 -->
        <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#8c7a63">Retainer Deposit Paid:</text>
        <text x="335" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="end">$5,000.00</text>
        <line x1="15" y1="85" x2="335" y2="85" stroke="#f0ebe0"/>

        <!-- Field 3 -->
        <text x="15" y="110" font-family="sans-serif" font-size="11" fill="#8c7a63">Scheduled Walkthrough:</text>
        <text x="335" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2c2419" text-anchor="end">May 14, 2026</text>
        <line x1="15" y1="125" x2="335" y2="125" stroke="#f0ebe0"/>

        <!-- Field 4 -->
        <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#8c7a63">Attached Contract PDF:</text>
        <text x="335" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ca981d" text-anchor="end">Oakridge_Agreement.pdf</text>
        <line x1="15" y1="165" x2="335" y2="165" stroke="#f0ebe0"/>

        <!-- Field 5 -->
        <text x="15" y="190" font-family="sans-serif" font-size="11" fill="#8c7a63">Ledger Sync Action:</text>
        <text x="335" y="190" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="end">Auto-Update Budget</text>
      </g>

      <!-- One-click Sync Button -->
      <g transform="translate(0, 365)">
        <rect width="350" height="46" rx="12" fill="#ca981d"/>
        <text x="175" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Sync to Ivory Cloud OS</text>
      </g>

      <!-- Secondary capture options -->
      <g transform="translate(0, 425)">
        <rect width="170" height="36" rx="8" fill="#faf6eb" stroke="#ebdcc0"/>
        <text x="85" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6e5d48" text-anchor="middle">📌 Save to Pinterest</text>

        <rect x="180" y="36" width="170" height="36" rx="8" fill="#faf6eb" stroke="#ebdcc0" transform="translate(0, -36)"/>
        <text x="265" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6e5d48" text-anchor="middle">📅 Add to Calendar</text>
      </g>
    </g>
  </g>
</svg>
