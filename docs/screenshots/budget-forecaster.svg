<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6eb"/>
      <stop offset="100%" stop-color="#f5ecdb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Header Banner -->
  <g transform="translate(50, 40)">
    <text x="0" y="30" font-family="serif" font-size="32" font-weight="bold" fill="#2c2419">Interactive Financial Engine &amp; Contingency Forecaster</text>
    <text x="0" y="55" font-family="sans-serif" font-size="14" fill="#6e5d48">Real-time budget allocation, vendor quote comparison, dynamic variance detection, and auto-adjusted reserves.</text>
  </g>

  <!-- KPI summary cards -->
  <g transform="translate(50, 120)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="260" height="95" rx="14" fill="#ffffff" stroke="#ebdcc0" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Target Cap</text>
    <text x="20" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2c2419">$75,000</text>
    <text x="160" y="65" font-family="sans-serif" font-size="12" fill="#10b981" font-weight="bold">Base Cap</text>

    <!-- KPI 2 -->
    <rect x="280" y="0" width="260" height="95" rx="14" fill="#ffffff" stroke="#ebdcc0" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Total Committed</text>
    <text x="20" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2c2419">$58,250</text>
    <text x="175" y="65" font-family="sans-serif" font-size="12" fill="#ca981d" font-weight="bold">77.6% Spent</text>

    <!-- KPI 3 -->
    <rect x="560" y="0" width="260" height="95" rx="14" fill="#ffffff" stroke="#ebdcc0" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Dynamic Contingency (10%)</text>
    <text x="20" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#047857">$7,500</text>
    <text x="170" y="65" font-family="sans-serif" font-size="12" fill="#047857" font-weight="bold">Protected</text>

    <!-- KPI 4 -->
    <rect x="840" y="0" width="260" height="95" rx="14" fill="#ffffff" stroke="#ebdcc0" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Unallocated Margin</text>
    <text x="20" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2563eb">$9,250</text>
    <text x="180" y="65" font-family="sans-serif" font-size="12" fill="#2563eb" font-weight="bold">Buffer</text>
  </g>

  <!-- Allocation Progress Bar -->
  <g transform="translate(50, 240)">
    <rect width="1100" height="40" rx="8" fill="#e5dec9"/>
    <!-- Venue: 38% -->
    <rect x="0" y="0" width="418" height="40" rx="8" fill="#ca981d"/>
    <!-- Catering: 24% -->
    <rect x="420" y="0" width="264" height="40" fill="#c27d53"/>
    <!-- Photo & Video: 14% -->
    <rect x="686" y="0" width="154" height="40" fill="#4a5d4e"/>
    <!-- Florals: 9% -->
    <rect x="842" y="0" width="99" height="40" fill="#ec4899"/>
    <!-- Contingency: 10% -->
    <rect x="943" y="0" width="110" height="40" rx="0" fill="#10b981"/>

    <!-- Legend labels below -->
    <text x="0" y="60" font-family="sans-serif" font-size="12" fill="#ca981d" font-weight="bold">■ Venue (38%)</text>
    <text x="150" y="60" font-family="sans-serif" font-size="12" fill="#c27d53" font-weight="bold">■ Catering &amp; Bar (24%)</text>
    <text x="350" y="60" font-family="sans-serif" font-size="12" fill="#4a5d4e" font-weight="bold">■ Photo / Video (14%)</text>
    <text x="530" y="60" font-family="sans-serif" font-size="12" fill="#ec4899" font-weight="bold">■ Florals &amp; Decor (9%)</text>
    <text x="730" y="60" font-family="sans-serif" font-size="12" fill="#10b981" font-weight="bold">■ Dynamic Contingency (10%)</text>
  </g>

  <!-- Detailed Ledger Table -->
  <g transform="translate(50, 330)">
    <rect width="1100" height="300" rx="16" fill="#ffffff" stroke="#ebdcc0" filter="url(#shadow)"/>
    
    <!-- Table Header -->
    <rect width="1100" height="45" rx="16" fill="#faf6eb"/>
    <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Category &amp; Service</text>
    <text x="330" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Booked Vendor</text>
    <text x="560" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Target Est.</text>
    <text x="710" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Actual / Quoted</text>
    <text x="880" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Variance</text>
    <text x="1000" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8c7a63" text-transform="uppercase">Status</text>

    <!-- Row 1 -->
    <g transform="translate(0, 50)">
      <line x1="20" y1="45" x2="1080" y2="45" stroke="#f0ebe0"/>
      <text x="30" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">Venue Rental &amp; Estate Fee</text>
      <text x="330" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">Oakridge Venue &amp; Estate</text>
      <text x="560" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">$15,000</text>
      <text x="710" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">$14,500</text>
      <text x="880" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">-$500 (Under)</text>
      <rect x="990" y="10" width="85" height="24" rx="12" fill="#10b981" fill-opacity="0.15"/>
      <text x="1032" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Booked</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 100)">
      <line x1="20" y1="45" x2="1080" y2="45" stroke="#f0ebe0"/>
      <text x="30" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">Farm-to-Table Catering &amp; Bar</text>
      <text x="330" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">Heirloom Culinary Group</text>
      <text x="560" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">$18,000</text>
      <text x="710" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">$17,200</text>
      <text x="880" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">-$800 (Under)</text>
      <rect x="990" y="10" width="85" height="24" rx="12" fill="#ca981d" fill-opacity="0.15"/>
      <text x="1032" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a47814" text-anchor="middle">Quoted</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 150)">
      <line x1="20" y1="45" x2="1080" y2="45" stroke="#f0ebe0"/>
      <text x="30" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">Artisan Florals &amp; Installations</text>
      <text x="330" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">Lush Petals Floral Studio</text>
      <text x="560" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">$6,000</text>
      <text x="710" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">$6,200</text>
      <text x="880" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">+$200 (Adjusted)</text>
      <rect x="990" y="10" width="85" height="24" rx="12" fill="#ca981d" fill-opacity="0.15"/>
      <text x="1032" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a47814" text-anchor="middle">Quoted</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 200)">
      <text x="30" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">Fine Art Photography &amp; Drone</text>
      <text x="330" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">Golden Hour Collective</text>
      <text x="560" y="28" font-family="sans-serif" font-size="13" fill="#6e5d48">$7,500</text>
      <text x="710" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c2419">$7,200</text>
      <text x="880" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">-$300 (Under)</text>
      <rect x="990" y="10" width="85" height="24" rx="12" fill="#10b981" fill-opacity="0.15"/>
      <text x="1032" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Booked</text>
    </g>
  </g>
</svg>
